<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>This Light · Cantrip Studio</title>
<meta name="description" content="A small toy from Cantrip Studio.">
<meta property="og:title" content="Cantrip Studio">
<meta property="og:description" content="A small toy from Cantrip Studio.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="theme.css">
<script src="copy.js" defer></script>
<script src="cities.js" defer></script>
<script src="app.js" defer></script>
</head>
<body class="tl">
<div class="tl-page">
 <div class="tl-top"><a href="../" data-c="brandLine"></a><span data-c="specimenNo"></span></div>
 <h1 class="tl-title" data-c="title"></h1>
 <p class="tl-lede" id="lede"></p>
 <p class="tl-note" id="note" hidden></p>
 <div class="tl-grid">
  <div class="tl-card tl-card--empty" id="card">
   <div class="tl-chip" id="chip" role="img"></div>
   <div class="tl-chipmeta"><span class="tl-phase" id="phase"></span><span class="tl-code" id="hex"></span><span class="tl-time" id="time"></span><span class="tl-code" id="alt"></span></div>
   <p class="tl-caveat" data-c="disclaimer"></p>
  </div>
  <div>
   <span class="tl-label" id="dial-label"></span>
   <svg class="tl-dial" viewBox="0 0 360 200" aria-hidden="true">
    <line class="hz" x1="10" y1="170" x2="350" y2="170"/><path class="arc" d="M30 170 A150 150 0 0 1 330 170"/><line class="tick" x1="180" y1="20" x2="180" y2="30"/>
    <circle class="sun" id="sun" cx="0" cy="0" r="11"/>
    <text x="60" y="190" data-c="dialRise"></text><text x="330" y="190" text-anchor="end" data-c="dialSet"></text><text x="180" y="14" text-anchor="middle" data-c="dialNoon"></text>
   </svg>
   <div class="tl-actions"><button class="tl-btn tl-btn--primary" id="show" data-c="primary"></button><button class="tl-btn" id="share" data-c="share" hidden></button><button class="tl-btn" id="compare" data-c="compare" hidden></button></div>
   <p class="tl-msg" id="msg" role="status" aria-live="polite"></p>
   <p class="tl-fine" data-c="privacy"></p>
  </div>
  <div class="tl-index">
   <label class="tl-label" for="search" data-c="cityLabel"></label>
   <input class="tl-search" id="search" autocomplete="off" spellcheck="false">
   <ul class="tl-list" id="list" role="listbox"></ul>
  </div>
 </div>
</div>
<div class="tl-toast" id="toast" role="status" hidden></div>
</body>
</html>
