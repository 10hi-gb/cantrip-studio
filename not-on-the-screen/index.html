<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Not on the Screen · Cantrip Studio</title>
<meta name="description" content="A small toy from Cantrip Studio.">
<meta property="og:title" content="Cantrip Studio">
<meta property="og:description" content="A small toy from Cantrip Studio.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="theme.css">
<script src="copy.js" defer></script>
<script src="lib.js" defer></script>
<script src="palette.js" defer></script>
<script src="app.js" defer></script>
</head>
<body class="ns">
<div class="ns-page">
 <div class="ns-studio"><a href="../" data-c="studioLabel" data-al="backLabel"></a></div>
 <div class="ns-plate"><h1 class="ns-title" data-c="title"></h1><p class="ns-sub" id="lede"></p></div>
 <div class="ns-grid">
  <div>
   <div class="ns-table" id="table"><div class="ns-platter"></div><div class="ns-disc" id="disc" role="img" tabindex="0"></div><div class="ns-hub"></div><div class="ns-index"></div></div>
   <p class="ns-caption" id="caption"></p>
  </div>
  <div>
   <section id="v-pick" hidden>
    <h2 class="ns-h" data-c="pickHeading"></h2>
    <div class="ns-keys" id="keys" role="group" data-al="pickHeading"></div>
    <p class="ns-hint" data-c="pickHint"></p>
    <p class="ns-msg" id="pmsg" role="status"></p>
    <div class="ns-clears" id="clears"></div>
    <div class="ns-actions"><button class="ns-btn ns-btn--primary" id="make" type="button" data-c="primary"></button></div>
    <p class="ns-fine" data-c="privacy"></p>
   </section>
   <section id="v-recv" hidden>
    <p class="ns-pair" id="rpair"></p><div class="ns-chipline" id="rchips"></div>
    <div class="ns-actions"><button class="ns-btn ns-btn--primary" id="see" type="button" data-c="receiverPrimary"></button><button class="ns-btn" id="mine" type="button" data-c="receiverAgain"></button></div>
    <p class="ns-fine" data-c="privacy"></p>
   </section>
   <section id="v-disc" hidden>
    <p class="ns-pair" id="dhead" tabindex="-1"></p><div class="ns-chipline" id="dchips"></div>
    <h2 class="ns-h ns-h--gap" data-c="spinHeading"></h2>
    <p class="ns-spin" data-c="spinHow"></p>
    <div class="ns-note ns-note--warn"><span data-c="flickerCaution"></span></div>
    <div class="ns-note"><span data-c="resultUnverified"></span></div>
    <div class="ns-actions"><button class="ns-btn ns-btn--primary" id="share" type="button" data-c="share"></button><button class="ns-btn" id="again" type="button" data-c="spinAgain"></button></div>
    <div class="ns-linkbox" id="linkbox" hidden><input readonly data-al="copyFail"></div>
    <details class="ns-note ns-details"><summary data-c="noMix"></summary><p data-c="noMixBody"></p>
     <b data-c="paperHeading"></b><ol class="ns-steps" id="steps"></ol><p id="paperColors"></p><span class="ns-hint ns-block" data-c="paperNote"></span></details>
    <p class="ns-fine" data-c="screenshotHonesty"></p>
    <div class="ns-actions"><button class="ns-btn" id="change" type="button" data-c="changePair"></button><button class="ns-btn" id="reset" type="button" data-c="reset"></button></div>
    <p class="ns-fine" data-c="privacy"></p>
   </section>
   <p class="ns-fine ns-foot" id="rm" hidden></p><p class="ns-msg" id="err" hidden></p>
  </div>
 </div>
</div>
<div class="ns-toast" id="toast" role="status" hidden></div>
</body>
</html>
