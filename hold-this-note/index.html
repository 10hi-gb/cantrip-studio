<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Hum a note. This page plays the pitch back as a tone you can send." />
<meta name="theme-color" content="#f6f3ec" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self'; media-src 'none'; connect-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
<title>Hold This Note — 10hi</title>
<style>
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: #f6f3ec;
    color: #1c1916;
    font-family: system-ui, -apple-system, sans-serif;
    line-height: 1.45;
    padding: 20px 16px 48px;
  }
  .home-logo {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 2;
    display: block;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    overflow: hidden;
  }
  .home-logo img { width: 100%; height: 100%; display: block; }
  main {
    max-width: 34rem;
    margin: 72px auto 0;
  }
  h1 {
    font-size: 1.75rem;
    font-weight: 650;
    letter-spacing: -0.03em;
    margin: 0 0 12px;
  }
  #lede, .hint {
    margin: 0 0 16px;
    color: #3f3a34;
    font-size: 1.05rem;
  }
  #status {
    min-height: 1.45em;
    margin: 0 0 16px;
    font-size: 1.15rem;
  }
  #status:empty { display: none; }
  .mark {
    display: inline-block;
    margin: 0 0 16px;
    padding: 10px 14px 10px 42px;
    border: 2px solid #1c1916;
    border-radius: 999px;
    font-weight: 700;
    position: relative;
    background: transparent;
  }
  .mark::before {
    content: "";
    position: absolute;
    left: 14px;
    top: 50%;
    width: 16px;
    height: 16px;
    border: 2px solid #1c1916;
    border-radius: 50%;
    transform: translateY(-50%);
  }
  .mark.landed {
    background: #efe2c6;
    border-radius: 12px;
  }
  .mark.landed::before {
    content: "✓";
    border: 0;
    width: auto;
    height: auto;
    font-size: 1rem;
    line-height: 1;
    background: transparent;
  }
  #meter {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 16px;
  }
  #meter[hidden], .mark[hidden] { display: none; }
  #meter span { min-width: 8.5rem; font-weight: 650; }
  #meter b {
    flex: 1;
    height: 12px;
    border: 2px solid #1c1916;
    border-radius: 999px;
    overflow: hidden;
    background: transparent;
  }
  #meter i {
    display: block;
    height: 100%;
    width: 100%;
    background: #1c1916;
    transform: scaleX(0);
    transform-origin: left center;
  }
  #actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button, input {
    font: inherit;
    color: #1c1916;
  }
  button {
    min-height: 44px;
    padding: 10px 16px;
    border-radius: 10px;
    border: 2px solid #1c1916;
    background: transparent;
    cursor: pointer;
  }
  button.primary { background: #1c1916; color: #f6f3ec; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  input {
    width: 100%;
    min-height: 44px;
    padding: 8px 10px;
    border: 2px solid #1c1916;
    border-radius: 10px;
    background: #fff;
  }
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 3px solid #1c1916;
    outline-offset: 3px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  @media (forced-colors: active) {
    button, .mark, #meter b { border: 1px solid ButtonText; }
  }
</style>
</head>
<body>
  <a class="home-logo" href="../" title="Home" aria-label="10hi home">
    <img src="../assets/logo.svg" width="40" height="40" alt="" />
  </a>
  <main>
    <h1>Hold This Note</h1>
    <p id="lede"></p>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="mark" class="mark" hidden aria-hidden="true"></p>
    <p id="meter" hidden aria-hidden="true">
      <span></span>
      <b aria-hidden="true"><i></i></b>
    </p>
    <div id="actions"></div>
    <noscript>
      <p>Hold This Note needs JavaScript to listen and to play the tone. Nothing is recorded either way.</p>
    </noscript>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
