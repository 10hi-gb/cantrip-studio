<!DOCTYPE html>
<html lang="en">
<head>

<title>10hi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 600;

  }
  p.lede { color: #555; max-width: 36rem; margin-bottom: 32px; }
  ul { list-style: none; }
  li { margin-bottom: 12px; }
  a.cantrip {
    color: #1a1a1a;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

    font-size: 12px;

  }

</head>

  <header>
    <a class="logo" href="./">
