<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>One Less Trip · Cantrip Studio</title>
<meta name="description" content="A small tool from Cantrip Studio.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="app.css">
<script src="copy.js" defer></script>
<script src="copy-extra.js" defer></script>
<script src="../shared/core.js" defer></script>
<script src="../shared/view.js" defer></script>
<script src="olt.js" defer></script>
<script src="app.js" defer></script>
</head>
<body class="olt">
<div class="olt-page">
 <div class="olt-strip"><a href="../" id="home"></a><span id="strip"></span></div>
 <h1 class="olt-title" id="title"></h1>
 <p class="olt-lede" id="lede"></p>
 <a class="olt-skip" href="#stops" id="skip"></a>
 <div class="olt-status olt-status--info" id="banner" role="status" hidden><p id="banner-t"></p><p class="mill-typed-note" id="banner-typed" hidden></p><button type="button" class="olt-btn" id="own-copy" hidden></button></div>
 <div class="olt-grid">
  <section class="olt-intake" id="intake" aria-labelledby="hh-h">
   <h2 class="olt-h2" id="hh-h"></h2>
   <p class="olt-meta" id="hh-meta"></p>
<p class="olt-fine olt-hint" id="hh-hint"></p>
   <ul class="olt-hh" id="hh"></ul>
   <button type="button" class="olt-mini" id="hh-add"></button>
   <p class="olt-err" id="hh-e" aria-live="polite"></p>
   <h2 class="olt-h2" id="rows-h"></h2>
   <p class="olt-meta" id="rows-meta"></p>
   <ol class="olt-rows" id="rows"></ol>
   <form class="olt-form" id="form" novalidate>
    <div class="olt-field"><label for="f-o" id="l-o"></label><select id="f-o"></select><span class="olt-err" id="e-o"></span></div>
    <div class="olt-field"><label for="f-i" id="l-i"></label><input id="f-i" autocomplete="off"><span class="olt-err" id="e-i"></span></div>
    <div class="olt-field is-s"><label for="f-q" id="l-q"></label><input id="f-q" inputmode="decimal" autocomplete="off"><span class="olt-err" id="e-q"></span></div>
    <div class="olt-field is-s"><label for="f-u" id="l-u"></label><input id="f-u" autocomplete="off"><span class="olt-err" id="e-u"></span></div>
    <div class="olt-field is-s"><label for="f-s" id="l-s"></label><input id="f-s" autocomplete="off" list="stoplist" aria-describedby="h-s"><span class="olt-hint" id="h-s"></span><span class="olt-err" id="e-s"></span></div>
    <datalist id="stoplist"></datalist>
    <div class="olt-field is-chk"><input type="checkbox" id="f-x"><label for="f-x" id="l-x"></label></div>
    <div class="olt-formacts"><button type="submit" class="olt-btn olt-btn--primary" id="f-add"></button><button type="button" class="olt-btn olt-btn--quiet" id="f-cancel" hidden></button></div>
    <p class="olt-err" id="e-form" aria-live="polite"></p>
<p class="olt-fine" id="limits"></p>
   </form>
  </section>
  <section id="stops" aria-labelledby="st-h" tabindex="-1">
   <h2 class="olt-h2" id="st-h"></h2>
   <p class="olt-meta" id="order"></p>
   <div class="olt-status olt-status--err" id="fix" role="alert" hidden></div>
<div id="samestop"></div>
   <p class="olt-ledger" id="ledger" role="status"></p>
   <div class="olt-belt" id="belt"><div class="olt-belt-lane" id="lane"></div></div>
   <div class="olt-tray" id="tray" hidden><p class="olt-tray-h" id="tray-h"></p><div id="tray-t"></div></div>
   <p class="olt-meta" id="progress"></p>
   <p class="olt-fine" id="notes"></p>
   <div class="olt-actions">
    <button type="button" class="olt-btn olt-btn--primary" id="b-copy"></button>
    <button type="button" class="olt-btn" id="b-print"></button>
    <button type="button" class="olt-btn" id="b-share"></button>
    <button type="button" class="olt-btn olt-btn--quiet" id="b-reset"></button>
   </div>
   <p class="olt-fine" id="blocked" hidden></p>
   <p class="olt-fine" id="privacy"></p>
<p class="olt-fine" id="linkroom" aria-live="polite"></p>
   <div class="olt-linkbox" id="linkbox" hidden><label class="olt-label" for="link" id="link-l"></label><textarea id="link" readonly rows="3"></textarea></div>
   <div id="fbwrap" hidden><label class="olt-label" for="fallback" id="fb-l"></label><textarea class="olt-fallback" id="fallback" readonly></textarea></div>
   <p class="olt-print-only olt-fine" id="pfoot"></p>
  </section>
 </div>
</div>
<div class="olt-toast" id="toast" role="status" hidden></div>
</body>
</html>
