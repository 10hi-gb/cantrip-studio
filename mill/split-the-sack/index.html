<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Split the Sack · Cantrip Studio</title>
<meta name="description" content="A small tool from Cantrip Studio.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
<script src="copy.js" defer></script>
<script src="copy-extra.js" defer></script>
<script src="../shared/core.js" defer></script>
<script src="sack.js" defer></script>
<script src="link.js" defer></script>
<script src="app.js" defer></script>
</head>
<body class="ss">
<div class="ss-page">
 <div class="ss-top"><a href="../" data-c="studioLabel" data-aria="backLabel"></a></div>
 <h1 class="ss-title" data-c="title"></h1>
 <p class="ss-lede" data-c="invitation"></p>
 <div class="ss-banner" id="banner" role="status" hidden><h2 class="ss-lab" id="banner-h" hidden></h2><p id="banner-t"></p><p id="banner-q" class="ss-quote" hidden><span class="ss-from-l" id="banner-ql"></span> <span id="banner-qv"></span></p></div>
 <div class="ss-grid">
  <section class="ss-table" aria-labelledby="h-table">
   <div class="ss-head">
    <div class="ss-sack"><svg viewBox="0 0 96 120" aria-hidden="true"><path class="bag" d="M10 14 Q48 4 86 14 L90 110 Q48 118 6 110 Z"/><line class="weave" x1="16" y1="12" x2="14" y2="112"/><line class="weave" x1="28" y1="12" x2="26" y2="112"/><line class="weave" x1="40" y1="12" x2="38" y2="112"/><line class="weave" x1="52" y1="12" x2="50" y2="112"/><line class="weave" x1="64" y1="12" x2="62" y2="112"/><line class="weave" x1="76" y1="12" x2="74" y2="112"/><rect class="band" x="12" y="46" width="72" height="26" rx="2"/><rect class="band2" x="12" y="72" width="72" height="6"/><path d="M16 14 Q30 22 48 14 Q66 22 80 14" fill="none" stroke="#A9AA9E" stroke-width="2"/></svg></div>
    <div><div class="ss-lcd"><span class="k" data-c="packageQtyLabel"></span><span class="k" data-c="priceLabel"></span><span class="k" data-c="feeLabel"></span><span class="v" id="lcd-q"></span><span class="v" id="lcd-p"></span><span class="v" id="lcd-f"></span></div><p class="ss-from" id="from" hidden></p><p class="ss-name" id="sname"></p></div>
   </div>
   <h2 class="ss-lab" id="h-table" data-c="tableHeading"></h2>
   <p class="ss-hint" id="caption" hidden></p>
   <div class="ss-rows" id="rows" role="table"></div>
   <div class="ss-status" id="status" role="status"></div>
   <div class="ss-assign" id="assign"></div>
   <div class="ss-why"><h3 data-c="residualHeading"></h3><p data-c="residualNote"></p><p id="residual"></p><p id="reconcile"></p></div>
   <div class="ss-print-only" id="printout"></div>
  </section>
  <section class="ss-panel ss-recv" id="recv" aria-labelledby="pick-l" hidden>
   <div class="ss-field"><label for="pick" id="pick-l" data-c="receiverPickLabel"></label><select id="pick"></select></div>
   <p class="ss-you" id="owncost" aria-live="polite"></p>
   <div class="ss-actions"><button type="button" class="ss-btn ss-btn--primary" id="change" data-c="answerChange"></button></div>
   <div id="changebox" hidden>
    <p class="ss-fine" id="changenote" data-c="changeNote"></p>
    <div class="ss-lab" id="amt-l"></div>
    <div class="ss-stepper" role="group" aria-labelledby="amt-l"><button type="button" id="down">−</button><output id="amt" aria-live="polite"></output><button type="button" id="up">+</button></div>
    <p class="ss-err" id="change-err" aria-live="polite"></p>
    <div class="ss-actions"><button type="button" class="ss-btn ss-btn--primary" id="makelink" data-c="changeMakeLink"></button><button type="button" class="ss-btn" id="cancel" data-c="changeCancel"></button></div>
    <div class="ss-linkbox" id="rlinkbox" hidden><div class="ss-field"><label for="rlink" data-c="linkLabel"></label><textarea id="rlink" readonly rows="3"></textarea></div></div>
   </div>
   <p class="ss-fine" data-c="privacy"></p>
  </section>
  <section class="ss-panel" id="editor" aria-labelledby="h-item">
   <h2 class="ss-lab" id="h-item" data-c="itemHeading"></h2>
   <div class="ss-field"><label for="item" data-c="itemLabel"></label><input id="item" maxlength="80" autocomplete="off" data-ph="itemPlaceholder"></div>
   <div class="ss-row3">
    <div class="ss-field"><label for="q" data-c="packageQtyLabel"></label><input id="q" inputmode="decimal" autocomplete="off" data-ph="packageQtyPlaceholder"></div>
    <div class="ss-field"><label for="u" data-c="unitLabel"></label><input id="u" maxlength="32" autocomplete="off" data-ph="unitPlaceholder" aria-describedby="u-h"></div>
    <div class="ss-field"><label for="inc" data-c="incrementLabel"></label><input id="inc" inputmode="decimal" autocomplete="off" data-ph="incrementPlaceholder" aria-describedby="inc-h"></div>
   </div>
   <p class="ss-hint" id="u-h" data-c="unitHint"></p>
   <p class="ss-hint" id="inc-h" data-c="incrementHint"></p>
   <div class="ss-row3">
    <div class="ss-field"><label for="c" data-c="currencyLabel"></label><input id="c" maxlength="6" autocomplete="off" data-ph="currencyPlaceholder" value="$"></div>
    <div class="ss-field"><label for="p" data-c="priceLabel"></label><input id="p" inputmode="decimal" autocomplete="off" data-ph="pricePlaceholder"></div>
    <div class="ss-field"><label for="f" data-c="feeLabel"></label><input id="f" inputmode="decimal" autocomplete="off" data-ph="feePlaceholder" aria-describedby="f-h"></div>
   </div>
   <p class="ss-hint" id="f-h" data-c="feeHint"></p>
   <div class="ss-lab" id="basis-l" data-c="feeBasisLabel"></div>
   <div class="ss-basis" role="group" aria-labelledby="basis-l"><button type="button" id="bp" aria-pressed="true" data-c="feeBasis.proportional"></button><button type="button" id="be" aria-pressed="false" data-c="feeBasis.equal"></button></div>
   <p class="ss-basis-note" id="basisnote"></p>
   <ul class="ss-err ss-errs" id="item-msg" aria-live="polite"></ul>
   <h2 class="ss-lab" data-c="householdsHeading"></h2>
   <p class="ss-hint" id="hcount"></p>
   <ol class="ss-hh" id="hh"></ol>
   <ul class="ss-err ss-errs" id="hh-msg" aria-live="polite"></ul>
   <div class="ss-actions"><button type="button" class="ss-btn" id="add" data-c="addHousehold"></button></div>
   <h2 class="ss-lab" data-c="proposalHeading"></h2>
   <p class="ss-err" id="notready"></p>
   <div class="ss-actions">
    <button type="button" class="ss-btn ss-btn--primary" id="copytext" data-c="copyProposal"></button>
    <button type="button" class="ss-btn" id="share" data-c="share"></button>
    <button type="button" class="ss-btn" id="print" data-c="printProposal"></button>
   </div>
   <p class="ss-fine" data-c="privacy"></p>
   <div class="ss-linkbox" id="linkbox" hidden><div class="ss-field"><label for="link" data-c="linkLabel"></label><textarea id="link" readonly rows="3"></textarea></div></div>
   <div class="ss-field"><label for="text" data-c="proposalHeading"></label><textarea id="text" class="ss-text" readonly></textarea></div>
   <p class="ss-fine" data-c="proposalSnapshot"></p>
   <p class="ss-fine" data-c="noPaymentNote"></p>
   <div class="ss-actions"><button type="button" class="ss-btn" id="reset" data-c="reset"></button></div>
  </section>
 </div>
</div>
<div class="ss-toast" id="toast" role="status" hidden></div>
</body>
</html>
