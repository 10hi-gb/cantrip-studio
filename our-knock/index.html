<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Our Knock · Cantrip Studio</title>
<meta name="description" content="A small toy from Cantrip Studio.">
<meta property="og:title" content="Cantrip Studio">
<meta property="og:description" content="A small toy from Cantrip Studio.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="theme.css">
<script src="copy.js" defer></script>
<script src="app.js" defer></script>
</head>
<body class="ok">
<main class="ok-stage">
 <div class="ok-side">
  <a class="ok-nav" href="../">Cantrip Studio</a>
  <h1 class="ok-title" id="h"></h1>
  <p class="ok-copy" id="lede"></p>
  <div class="ok-taps" id="taps" aria-hidden="true"></div>
  <p class="ok-msg" id="msg" role="status" aria-live="polite"></p>
  <p class="ok-fine" id="hint"></p>
 </div>
 <div class="ok-frame">
  <div class="ok-behind" id="behind"></div>
  <div class="ok-door" id="door" tabindex="0" role="button" aria-label="The door. Tap it or press Space to knock.">
   <div class="ok-panel"></div><div class="ok-panel"></div>
   <span class="ok-peep"></span><span class="ok-knocker"></span><span class="ok-knob"></span>
  </div>
  <div class="ok-step"></div>
 </div>
 <div class="ok-side">
  <div id="p-make" hidden>
   <div class="ok-row"><button class="ok-btn" id="replay" data-c="replay"></button><button class="ok-btn" id="redo" data-c="redo"></button></div>
   <p></p>
   <label class="ok-field-wrap"><span data-c="noteLabel"></span><input class="ok-field" id="note" maxlength="200" autocomplete="off"></label>
   <p class="ok-fine" id="note-msg" role="status"></p>
   <button class="ok-btn ok-btn--brass" id="closeDoor" data-c="primary"></button>
  </div>
  <div id="p-share" hidden>
   <button class="ok-btn ok-btn--brass" id="share" data-c="share"></button>
   <p class="ok-fine" data-c="privacy"></p>
  </div>
  <div id="p-recv" hidden>
   <button class="ok-btn" id="teach" data-c="teach"></button>
   <p class="ok-fine" data-c="teachHint"></p>
  </div>
  <div id="p-open" hidden><a class="ok-btn ok-btn--brass" id="back" href="./" data-c="knockBack"></a></div>
  <div id="p-bad" hidden><a class="ok-btn ok-btn--brass" href="./" data-c="knockBack"></a></div>
  <p><button class="ok-mute" id="mute" aria-pressed="false" data-c="soundHint"></button></p>
 </div>
</main>
<div class="ok-toast" id="toast" role="status" hidden></div>
</body>
</html>
